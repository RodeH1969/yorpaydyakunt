<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f2ea">
<title>Editor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="editor">
  <span class="wordmark">yorpaydyakunt</span>

  <section id="login" hidden>
    <form id="login-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="go" type="submit">Enter</button>
      <p class="msg" id="login-msg"></p>
    </form>
  </section>

  <section id="dash" hidden>
    <form id="publish">
      <label for="title">Title</label>
      <input id="title" maxlength="80" required>

      <label for="suburb">Suburb</label>
      <input id="suburb" maxlength="80" required>

      <label for="state">State</label>
      <select id="state" required>
        <option value="">Pick</option>
        <option>QLD</option>
        <option>NSW</option>
        <option>VIC</option>
        <option>SA</option>
        <option>WA</option>
        <option>TAS</option>
        <option>NT</option>
        <option>ACT</option>
      </select>

      <label for="date">Date</label>
      <input id="date" type="date" required>

      <label for="teaser">Feed teaser</label>
      <textarea id="teaser" maxlength="400" required></textarea>

      <label for="body">Popup text</label>
      <textarea id="body" class="tall" maxlength="4000" required></textarea>

      <button class="go" id="save" type="submit">Publish</button>
      <button class="del" id="cancel" type="button" hidden>Cancel edit</button>
      <p class="msg" id="publish-msg"></p>
    </form>

    <h2>Published</h2>
    <ul id="list"></ul>

    <button class="out" id="logout" type="button">Log out</button>
  </section>
</main>
<script src="/editor.js"></script>
</body>
</html>
