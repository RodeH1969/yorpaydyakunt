<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f2ea">
<!--META-->
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="masthead">
  <a class="wordmark" href="/">yorpaydyakunt</a>
  <button class="lead-btn" id="lead-open" type="button">Send a lead</button>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="State"></nav>

<main id="feed"></main>

<div id="overlay" class="overlay" hidden>
  <div class="popup" id="popup" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <button class="close" id="close" type="button" aria-label="Close">&#10005;</button>
    <h2 class="title popup-title" id="popup-title"></h2>
    <p class="meta"><span id="popup-place"></span><br><span id="popup-date"></span></p>
    <div class="popup-body" id="popup-body"></div>
    <footer class="popup-foot">
      <p class="count" id="popup-count"></p>
      <button class="share" id="popup-share" type="button">&#8599; SHARE</button>
    </footer>
  </div>
</div>

<div id="lead-overlay" class="overlay" hidden>
  <div class="popup lead-popup" id="lead-popup" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="lead-title">
    <button class="close" id="lead-close" type="button" aria-label="Close">&#10005;</button>
    <h2 class="title popup-title" id="lead-title">Send a lead</h2>
    <form id="lead-form" class="lead-form">
      <label for="lead-text">Lead</label>
      <textarea id="lead-text" maxlength="1000" required></textarea>

      <label for="lead-city">City</label>
      <input id="lead-city" maxlength="80" required>

      <label for="lead-suburb">Suburb</label>
      <input id="lead-suburb" maxlength="80" required>

      <label for="lead-date">Date it happened</label>
      <input id="lead-date" type="date" required>

      <button class="share" id="lead-send" type="submit">SEND</button>
      <p class="lead-msg" id="lead-msg"></p>
    </form>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
